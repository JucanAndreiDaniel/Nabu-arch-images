# davinci: the PMIC power key produces press events (phantom or physical)
# and logind's default HandlePowerKey=poweroff shuts the phone down ~a
# minute after boot; with USB plugged the PMIC auto-boots, looking like a
# spontaneous reboot. Ignore all button/switch actions during bring-up.
# Physical control remains: 10s+ power hold force-cuts via the PMIC
# hardware regardless of Linux.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
