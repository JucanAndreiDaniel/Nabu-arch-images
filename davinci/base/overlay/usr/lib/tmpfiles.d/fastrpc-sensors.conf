# DSP sensor registry ownership (see hexagonrpcd): the ADSP writes
# calibration version/temp files back through hexagonfs, so the tree
# must belong to the fastrpc user. Runs after sysusers creates it.
# (A post-apply chown can't work: fastrpc doesn't exist at build time.)
Z /usr/share/qcom/sm7150/Xiaomi/davinci/sensors - fastrpc fastrpc - -
