name: Build davinci

# No external [davinci] pacman repo exists yet, so this workflow builds the
# device packages itself (native aarch64, ArchLinuxARM chroot via
# arch-install-scripts) and installs them into the rootfs with `pacman -U`.
# (Docker Hub's archlinux image is x86_64-only, so no container shortcut.)
#
# Speedups: the kernel package is skipped when its packaging inputs are
# unchanged (actions/cache), and kernel rebuilds use a persisted ccache.
#
# Artifacts: images/boot-davinci-samsung.img (pinned prebuilt U-Boot) +
# images/rootfs-davinci-samsung.img (Arch + systemd-boot + UKI).

on:
  workflow_dispatch:

jobs:
  build-davinci-pkgs:
    name: Build davinci packages
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Update apt cache
        run: sudo apt-get update

      - name: Install tools
        run: sudo apt-get install -y git arch-install-scripts wget libarchive-tools e2fsprogs

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: repo
          ref: ${{ github.ref_name }}

      - name: Restore kernel package cache
        id: kernel-cache
        uses: actions/cache@v6
        with:
          # Exact match only: a stale kernel build must never be reused.
          path: pkgs/linux-davinci*.pkg.tar.*
          key: davinci-kernel-${{ hashFiles('repo/davinci/packaging/linux-davinci/**') }}

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ccache
          key: davinci-ccache-${{ hashFiles('repo/davinci/packaging/linux-davinci/**') }}
          restore-keys: |
            davinci-ccache-

      - name: Download generic rootfs tarball
        run: |
          if ! wget --timeout=30 --tries=2 --waitretry=5 "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz; then
            echo "Primary mirror failed, falling back to GitHub release"
            wget --timeout=30 --tries=2 "https://github.com/Kumar-Jy/nabu-pkgs/releases/download/repo/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz
          fi

      - name: Extract build chroot
        run: |
          # NOTE: the chroot must live on a real (ext4) filesystem. On the
          # runner's root fs pacman inside arch-chroot fails with
          # "could not determine cachedir mount point". Same pattern as the
          # loop-mounted rootfs image jobs.
          truncate -s 16G ./pkgbuild.img
          mkfs.ext4 ./pkgbuild.img
          mkdir -p pkgroot pkgs
          sudo mount -o loop ./pkgbuild.img ./pkgroot/
          sudo bsdtar -xpf ArchLinuxARM-aarch64-latest.tar.gz -C pkgroot

      - name: Prepare build chroot
        run: |
          sudo arch-chroot ./pkgroot bash - <<'EOF'
          set -e
          pacman-key --init
          pacman-key --populate archlinuxarm
          cat > /etc/pacman.d/mirrorlist <<'EOM'
          Server = http://ca.us.mirror.archlinuxarm.org/$arch/$repo
          Server = http://nj.us.mirror.archlinuxarm.org/$arch/$repo
          EOM
          pacman -Sy --noconfirm
          pacman -S --noconfirm base-devel sudo curl git ccache
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          mkdir -p /home/builder/.cache/ccache
          EOF

      - name: Build packages in chroot
        env:
          SKIP_KERNEL: ${{ steps.kernel-cache.outputs.cache-hit == 'true' && '1' || '' }}
        run: |
          mkdir -p pkgs ccache
          sudo mkdir -p ./pkgroot/out ./pkgroot/home/builder/.cache/ccache
          sudo mount --bind ./pkgs ./pkgroot/out
          sudo mount --bind ./ccache ./pkgroot/home/builder/.cache/ccache
          for pkg in linux-firmware-xiaomi-davinci linux-davinci; do
            if [ -n "$SKIP_KERNEL" ] && [ "$pkg" = "linux-davinci" ]; then
              echo "Kernel packaging inputs unchanged, reusing cached package:"
              ls -l ./pkgs/
              continue
            fi
            sudo rm -rf ./pkgroot/build
            sudo mkdir -p ./pkgroot/build
            sudo cp -r ./repo/davinci/packaging/$pkg/* ./pkgroot/build/
            sudo arch-chroot ./pkgroot bash - <<EOF
          set -e
          chown -R builder:builder /build /home/builder/.cache/ccache
          cd /build
          runuser -u builder -- env MAKEFLAGS="-j\$(nproc)" \
            CCACHE_DIR=/home/builder/.cache/ccache CCACHE_MAXSIZE=4G \
            PATH=/usr/lib/ccache/bin:/usr/local/sbin:/usr/local/bin:/usr/bin \
            makepkg -s --noconfirm --needed
          cp /build/*.pkg.tar.* /out/
          runuser -u builder -- env CCACHE_DIR=/home/builder/.cache/ccache ccache -s || true
          EOF
          done
          sudo umount ./pkgroot/out ./pkgroot/home/builder/.cache/ccache
          sudo chown -R $USER:$USER ./pkgs ./ccache
          ls -l ./pkgs/

      - name: Upload packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: davinci-pkgs
          path: ./pkgs/*.pkg.tar.*
          retention-days: 90
          compression-level: 0

  build-davinci-image:
    name: Build davinci image (Samsung)
    runs-on: ubuntu-24.04-arm
    needs: build-davinci-pkgs
    steps:
      - name: Update apt cache
        run: sudo apt-get update

      - name: Install tools
        run: sudo apt-get install -y git arch-install-scripts wget libarchive-tools e2fsprogs pigz dosfstools parted

      - name: Install sparse-image tools (best effort)
        run: sudo apt-get install -y android-sdk-libsparse-utils || echo "img2simg unavailable, will ship a raw image"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: repo
          ref: ${{ github.ref_name }}

      - name: Download device packages
        uses: actions/download-artifact@v8
        with:
          name: davinci-pkgs
          path: ./pkgs

      - name: Verify pinned U-Boot
        run: |
          cd repo/davinci
          chmod +x scripts/fetch-uboot.sh
          mkdir -p images
          ./scripts/fetch-uboot.sh ./images
          ls -l images/

      # U-Boot's preboot blkmaps the *hosting* partition (userdata) and its
      # bootmgr boots from a nested ESP inside it (see qcom-phone.env:
      # "blkmap create root ... scsi 0 $userdata_start"). A raw ext4 image
      # has no nested GPT/ESP, hence "Failed to iterate over directory EFI".
      # Layout (4096-byte sectors, like the UFS): p1 = 512MiB FAT32 ESP,
      # p2 = ext4 root. ESP 1MiB..513MiB, root from 513MiB (byte offset
      # 537919488) — the davinci_nested initramfs hook hardcodes these.
      - name: Create nested image
        run: |
          truncate -s 8G ./userdata-nested.raw
          LOOP=$(sudo losetup --sector-size 4096 -P --show -f ./userdata-nested.raw)
          echo "NESTED_LOOP=$LOOP" >> $GITHUB_ENV
          sudo parted -s $LOOP mklabel gpt
          sudo parted -s $LOOP mkpart ESP fat32 1MiB 513MiB
          sudo parted -s $LOOP mkpart root ext4 513MiB 100%
          sudo parted -s $LOOP set 1 esp on
          sudo parted -s $LOOP unit s print
          sudo udevadm settle
          ls -l ${LOOP}p1 ${LOOP}p2

      - name: Format nested partitions
        run: |
          sudo mkfs.fat -F32 -n ESPDAVINCI ${NESTED_LOOP}p1
          sudo mkfs.ext4 -L arch-davinci ${NESTED_LOOP}p2
          echo "ESP_UUID=$(sudo blkid -s UUID -o value ${NESTED_LOOP}p1)" >> $GITHUB_ENV
          echo "ROOT_UUID=$(sudo blkid -s UUID -o value ${NESTED_LOOP}p2)" >> $GITHUB_ENV

      - name: Mount nested partitions
        run: |
          mkdir -p mountpoint
          sudo mount ${NESTED_LOOP}p2 ./mountpoint/
          sudo mkdir -p ./mountpoint/boot
          sudo mount ${NESTED_LOOP}p1 ./mountpoint/boot

      - name: Download generic rootfs tarball
        run: |
          if ! wget --timeout=30 --tries=2 --waitretry=5 "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz; then
            echo "Primary mirror failed, falling back to GitHub release"
            wget --timeout=30 --tries=2 "https://github.com/Kumar-Jy/nabu-pkgs/releases/download/repo/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz
          fi

      - name: Build rootfs-extractor image
        run: |
          echo '
          FROM alpine:latest
          RUN apk add --no-cache libarchive-tools
          ENTRYPOINT ["/bin/sh"]
          ' > Dockerfile
          docker build -t rootfs-extractor .

      - name: Extract rootfs
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/ArchLinuxARM-aarch64-latest.tar.gz:/rootfs.tar \
            -v ${{ github.workspace }}/mountpoint:/mountpoint \
            rootfs-extractor -c "
              cd /mountpoint && bsdtar -xpf /rootfs.tar
            "

      - name: Stage device packages
        run: |
          # NOTE: stage under /root, not /tmp — arch-chroot covers the
          # chroot's /tmp with a host bind mount, hiding staged files.
          sudo mkdir -p ./mountpoint/root/davinci-pkgs
          sudo cp ./pkgs/*.pkg.tar.* ./mountpoint/root/davinci-pkgs/
          sudo ls -l ./mountpoint/root/davinci-pkgs/

      - name: Init pacman key store
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman-key --init
          pacman-key --populate archlinuxarm
          EOF

      - name: Configure pacman
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          cat > /etc/pacman.d/mirrorlist <<'EOM'
          Server = http://ca.us.mirror.archlinuxarm.org/$arch/$repo
          Server = http://nj.us.mirror.archlinuxarm.org/$arch/$repo
          EOM
          sed -i "s/#ParallelDownloads/ParallelDownloads/g" /etc/pacman.conf
          sed -i "s/#DisableSandboxFilesystem/DisableSandboxFilesystem/g" /etc/pacman.conf
          sed -i "s/#DisableSandboxSyscalls/DisableSandboxSyscalls/g" /etc/pacman.conf
          n=0
          until pacman -Sy --noconfirm; do
            n=$((n+1))
            if [ $n -ge 3 ]; then exit 1; fi
            sleep 5
          done
          EOF

      - name: Delete default user, set locale
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          userdel alarm || true
          sed -i "s|#en_US.UTF-8 UTF-8|en_US.UTF-8 UTF-8|g" "/etc/locale.gen"
          locale-gen
          echo "LANG=en_US.UTF-8" > "/etc/locale.conf"
          EOF

      - name: Remove generic kernel, update, install davinci stack
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          set -e
          pacman -R --noconfirm linux-aarch64 || true
          n=0
          until pacman -Syu --noconfirm; do
            n=$((n+1))
            if [ $n -ge 3 ]; then exit 1; fi
            sleep 5
          done
          # linux-davinci-headers replaces linux-api-headers (same pattern as
          # the official linux-aarch64-headers package).
          pacman -Rdd --noconfirm linux-api-headers || true
          # Device packages built by the build-davinci-pkgs job
          # (linux-davinci + linux-davinci-headers split packages).
          pacman -U --noconfirm /root/davinci-pkgs/linux-davinci*.pkg.tar.*
          pacman -U --noconfirm /root/davinci-pkgs/linux-firmware-xiaomi-davinci-*.pkg.tar.* \
            || pacman -S --noconfirm linux-firmware
          rm -rf /root/davinci-pkgs
          # NOTE: no separate systemd-boot package on Arch — bootctl ships
          # with systemd.
          pacman -S --noconfirm ukify systemd
          pacman -S --noconfirm tqftpserv || true
          pacman -S --noconfirm sudo terminus-font networkmanager bluez bluez-utils zram-generator dosfstools
          systemctl enable bluetooth NetworkManager
          systemctl enable systemd-zram-setup@zram0.service || true
          systemctl disable sshd || true
          echo "%wheel ALL=(ALL:ALL) ALL" > /etc/sudoers.d/10-wheel
          EOF

      - name: Apply davinci overlay
        run: |
          sudo cp ./repo/davinci/base/overlay/* -r ./mountpoint/
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          chmod +x /overlay-post-apply /usr/libexec/davinci/uki-regenerate /usr/libexec/davinci/combine-cmdline
          /overlay-post-apply
          rm /overlay-post-apply
          EOF

      - name: Fill nested filesystem UUIDs
        run: |
          # The inner root has no PARTLABEL (plain offset loop), so fstab and
          # the UKI cmdline must use the UUIDs captured at format time.
          # Must run after the overlay copy (placeholders) and before mkinitcpio.
          # combine-cmdline re-runs here because overlay-post-apply combined
          # the placeholders; the UKIs bake the combined files, not root.conf.
          sudo sed -i "s/DAVINCI-ROOT-UUID/$ROOT_UUID/g; s/DAVINCI-ESP-UUID/$ESP_UUID/g" ./mountpoint/etc/fstab
          sudo sed -i "s/DAVINCI-ROOT-UUID/$ROOT_UUID/g" ./mountpoint/etc/cmdline.d/root.conf
          sudo arch-chroot ./mountpoint /usr/libexec/davinci/combine-cmdline
          if sudo grep -rqE "DAVINCI-(ROOT|ESP)-UUID" ./mountpoint/etc/; then
            echo "ERROR: unfilled UUID placeholder left behind" >&2
            exit 1
          fi
          sudo cat ./mountpoint/etc/fstab ./mountpoint/etc/cmdline.d/combined-default.conf ./mountpoint/etc/cmdline.d/combined-debug.conf

      - name: Install systemd-boot + generate UKI
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          set -e
          # /boot is the nested FAT ESP here, so this is a normal ESP layout:
          # install the systemd-boot binaries and build the UKI onto it.
          mkdir -p /boot/EFI/BOOT /boot/EFI/systemd /boot/EFI/Linux /boot/loader/entries
          cp /usr/lib/systemd/boot/efi/systemd-bootaa64.efi /boot/EFI/systemd/systemd-bootaa64.efi
          cp /usr/lib/systemd/boot/efi/systemd-bootaa64.efi /boot/EFI/BOOT/bootaa64.efi
          sed -i "s|HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)|HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block filesystems fsck)|g" /etc/mkinitcpio.conf || true
          mkinitcpio -P
          test -f /boot/EFI/Linux/arch-linux-davinci.efi
          test -f /boot/EFI/Linux/arch-linux-davinci-debug.efi
          test -f /boot/EFI/Linux/arch-linux-davinci-debug-nokaslr.efi
          test -f /boot/EFI/Linux/arch-linux-davinci-debug-novamap.efi
          test -f /boot/EFI/BOOT/bootaa64.efi
          ls -l /boot/EFI/ /boot/EFI/Linux/ /boot/loader/entries/ || true
          EOF

      - name: Inspect UKIs (boot forensics without flashing)
        run: |
          # Proves what the kernel stub actually received: section sizes,
          # the baked .cmdline (UUIDs filled? efi=debug/davinci_debug?),
          # and that .dtb is the Samsung DTB with earlycon bootargs.
          # Catches empty-cmdline / wrong-DTB image bugs offline.
          sudo apt-get install -y device-tree-compiler
          for uki in ./mountpoint/boot/EFI/Linux/arch-linux-davinci*.efi; do
            echo "===== $uki ====="
            sudo objdump -h "$uki" | grep -E '\.(linux|initrd|cmdline|dtb|osrel|uname)'
            echo "--- .cmdline ---"
            sudo objcopy -O binary --only-section=.cmdline "$uki" /tmp/uki-cmdline.bin
            tr '\0' '\n' < /tmp/uki-cmdline.bin
            echo "--- .dtb identity ---"
            sudo objcopy -O binary --only-section=.dtb "$uki" /tmp/uki-dtb.dtb
            fdtdump /tmp/uki-dtb.dtb | grep -E 'model|compatible|bootargs|stdout-path' | head -n 12
          done

      - name: Create user, clean cache
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          useradd -m -G wheel,audio,video,storage,optical -s /bin/bash user
          echo "user:123456" | chpasswd
          yes | pacman -Scc || true
          EOF

      - name: Unmount, pack, assemble artifacts
        run: |
          sudo umount -R ./mountpoint
          rmdir ./mountpoint
          sudo e2fsck -f ${NESTED_LOOP}p2 -y || true
          sudo losetup -d $NESTED_LOOP
          mkdir -p ./images
          # Sparse Android image flashes much faster; fastboot accepts both
          # sparse and raw, so normalize on one artifact name either way.
          if command -v img2simg >/dev/null; then
            img2simg ./userdata-nested.raw ./images/userdata-nested.img
            rm -f ./userdata-nested.raw
          else
            mv ./userdata-nested.raw ./images/userdata-nested.img
          fi
          # Bring in the verified prebuilt U-Boot (already fetched above).
          if [ ! -f ./images/boot-davinci-samsung.img ]; then
            cp ./repo/davinci/images/boot-davinci-samsung.img ./images/ 2>/dev/null || \
              (cd repo/davinci && ./scripts/fetch-uboot.sh ../../images)
          fi
          cp ./repo/davinci/flash-davinci-samsung.sh .
          cp ./repo/davinci/flash-davinci-samsung.bat .
          cp ./repo/davinci/README.md ./README-davinci.md
          cp ./repo/davinci/uboot.env .
          chmod +x flash-davinci-samsung.sh
          ls -l ./images/
          sha256sum ./images/* > ./images/SHA256SUMS
          cat ./images/SHA256SUMS

      - name: Upload davinci artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-davinci-samsung
          path: |
            images
            flash-davinci-samsung.sh
            flash-davinci-samsung.bat
            README-davinci.md
            uboot.env
          retention-days: 90
          compression-level: 5
