name: Build davinci

# No external [davinci] pacman repo exists yet, so this workflow builds the
# device packages itself (native aarch64, archlinux container) and installs
# them into the rootfs with `pacman -U`.
#
# Artifacts: images/boot-davinci-samsung.img (pinned prebuilt U-Boot) +
# images/rootfs-davinci-samsung.img (Arch + systemd-boot + UKI).

# No external [davinci] pacman repo exists yet, so this workflow builds the
# device packages itself (native aarch64, ArchLinuxARM chroot via
# arch-install-scripts) and installs them into the rootfs with `pacman -U`.
# (Docker Hub's archlinux image is x86_64-only, so no container shortcut.)
#
# Artifacts: images/boot-davinci-samsung.img (pinned prebuilt U-Boot) +
# images/rootfs-davinci-samsung.img (Arch + systemd-boot + UKI).

on:
  workflow_dispatch:

jobs:
  build-davinci-pkgs:
    name: Build davinci packages
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Update apt cache
        run: sudo apt-get update

      - name: Install tools
        run: sudo apt-get install -y git arch-install-scripts wget libarchive-tools e2fsprogs

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: repo
          ref: ${{ github.ref_name }}

      - name: Download generic rootfs tarball
        run: |
          if ! wget --timeout=30 --tries=2 --waitretry=5 "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz; then
            echo "Primary mirror failed, falling back to GitHub release"
            wget --timeout=30 --tries=2 "https://github.com/Kumar-Jy/nabu-pkgs/releases/download/repo/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz
          fi

      - name: Extract build chroot
        run: |
          # NOTE: the chroot must live on a real (ext4) filesystem. On the
          # runner's root fs pacman inside arch-chroot fails with
          # "could not determine cachedir mount point". Same pattern as the
          # loop-mounted rootfs image jobs.
          truncate -s 16G ./pkgbuild.img
          mkfs.ext4 ./pkgbuild.img
          mkdir -p pkgroot pkgs
          sudo mount -o loop ./pkgbuild.img ./pkgroot/
          sudo bsdtar -xpf ArchLinuxARM-aarch64-latest.tar.gz -C pkgroot

      - name: Prepare build chroot
        run: |
          sudo arch-chroot ./pkgroot bash - <<'EOF'
          set -e
          pacman-key --init
          pacman-key --populate archlinuxarm
          cat > /etc/pacman.d/mirrorlist <<'EOM'
          Server = http://ca.us.mirror.archlinuxarm.org/$arch/$repo
          Server = http://nj.us.mirror.archlinuxarm.org/$arch/$repo
          EOM
          pacman -Sy --noconfirm
          pacman -S --noconfirm base-devel sudo curl git
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          EOF

      - name: Build packages in chroot
        run: |
          for pkg in linux-firmware-xiaomi-davinci linux-davinci; do
            sudo rm -rf ./pkgroot/build
            sudo mkdir -p ./pkgroot/build
            sudo cp -r ./repo/davinci/packaging/$pkg/* ./pkgroot/build/
            sudo arch-chroot ./pkgroot bash - <<EOF
          set -e
          export MAKEFLAGS="-j\$(nproc)"
          chown -R builder:builder /build
          cd /build
          runuser -u builder -- makepkg -s --noconfirm --needed
          mkdir -p /out
          cp /build/*.pkg.tar.* /out/
          EOF
          done
          sudo chown -R $USER:$USER ./pkgroot/out
          mkdir -p pkgs
          cp ./pkgroot/out/*.pkg.tar.* ./pkgs/
          ls -l ./pkgs/

      - name: Upload packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: davinci-pkgs
          path: ./pkgs/*.pkg.tar.*
          retention-days: 90
          compression-level: 0

  build-davinci-image:
    name: Build davinci image (Samsung)
    runs-on: ubuntu-24.04-arm
    needs: build-davinci-pkgs
    steps:
      - name: Update apt cache
        run: sudo apt-get update

      - name: Install tools
        run: sudo apt-get install -y git arch-install-scripts wget libarchive-tools e2fsprogs pigz dosfstools

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: repo
          ref: ${{ github.ref_name }}

      - name: Download device packages
        uses: actions/download-artifact@v8
        with:
          name: davinci-pkgs
          path: ./pkgs

      - name: Verify pinned U-Boot
        run: |
          cd repo/davinci
          chmod +x scripts/fetch-uboot.sh
          mkdir -p images
          ./scripts/fetch-uboot.sh ./images
          ls -l images/

      - name: Create and mount image
        run: |
          truncate -s 20G ./rootfs-davinci-samsung.img
          mkfs.ext4 ./rootfs-davinci-samsung.img
          mkdir mountpoint
          sudo mount -o loop ./rootfs-davinci-samsung.img ./mountpoint/
          sudo mkdir -p ./mountpoint/boot

      - name: Download generic rootfs tarball
        run: |
          if ! wget --timeout=30 --tries=2 --waitretry=5 "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz; then
            echo "Primary mirror failed, falling back to GitHub release"
            wget --timeout=30 --tries=2 "https://github.com/Kumar-Jy/nabu-pkgs/releases/download/repo/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz
          fi

      - name: Build rootfs-extractor image
        run: |
          echo '
          FROM alpine:latest
          RUN apk add --no-cache libarchive-tools
          ENTRYPOINT ["/bin/sh"]
          ' > Dockerfile
          docker build -t rootfs-extractor .

      - name: Extract rootfs
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/ArchLinuxARM-aarch64-latest.tar.gz:/rootfs.tar \
            -v ${{ github.workspace }}/mountpoint:/mountpoint \
            rootfs-extractor -c "
              cd /mountpoint && bsdtar -xpf /rootfs.tar
            "

      - name: Stage device packages
        run: |
          # NOTE: stage under /root, not /tmp — arch-chroot covers the
          # chroot's /tmp with a host bind mount, hiding staged files.
          sudo mkdir -p ./mountpoint/root/davinci-pkgs
          sudo cp ./pkgs/*.pkg.tar.* ./mountpoint/root/davinci-pkgs/
          sudo ls -l ./mountpoint/root/davinci-pkgs/

      - name: Init pacman key store
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          pacman-key --init
          pacman-key --populate archlinuxarm
          EOF

      - name: Configure pacman
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          cat > /etc/pacman.d/mirrorlist <<'EOM'
          Server = http://ca.us.mirror.archlinuxarm.org/$arch/$repo
          Server = http://nj.us.mirror.archlinuxarm.org/$arch/$repo
          EOM
          sed -i "s/#ParallelDownloads/ParallelDownloads/g" /etc/pacman.conf
          sed -i "s/#DisableSandboxFilesystem/DisableSandboxFilesystem/g" /etc/pacman.conf
          sed -i "s/#DisableSandboxSyscalls/DisableSandboxSyscalls/g" /etc/pacman.conf
          n=0
          until pacman -Sy --noconfirm; do
            n=$((n+1))
            if [ $n -ge 3 ]; then exit 1; fi
            sleep 5
          done
          EOF

      - name: Delete default user, set locale
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          userdel alarm || true
          sed -i "s|#en_US.UTF-8 UTF-8|en_US.UTF-8 UTF-8|g" "/etc/locale.gen"
          locale-gen
          echo "LANG=en_US.UTF-8" > "/etc/locale.conf"
          EOF

      - name: Remove generic kernel, update, install davinci stack
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          set -e
          pacman -R --noconfirm linux-aarch64 || true
          n=0
          until pacman -Syu --noconfirm; do
            n=$((n+1))
            if [ $n -ge 3 ]; then exit 1; fi
            sleep 5
          done
          # linux-davinci-headers replaces linux-api-headers (same pattern as
          # the official linux-aarch64-headers package).
          pacman -Rdd --noconfirm linux-api-headers || true
          # Device packages built by the build-davinci-pkgs job
          # (linux-davinci + linux-davinci-headers split packages).
          pacman -U --noconfirm /root/davinci-pkgs/linux-davinci*.pkg.tar.*
          pacman -U --noconfirm /root/davinci-pkgs/linux-firmware-xiaomi-davinci-*.pkg.tar.* \
            || pacman -S --noconfirm linux-firmware
          rm -rf /root/davinci-pkgs
          pacman -S --noconfirm ukify systemd systemd-boot
          pacman -S --noconfirm tqftpserv || true
          pacman -S --noconfirm sudo terminus-font networkmanager bluez bluez-utils zram-generator
          systemctl enable bluetooth NetworkManager
          systemctl enable systemd-zram-setup@zram0.service || true
          systemctl disable sshd || true
          echo "%wheel ALL=(ALL:ALL) ALL" > /etc/sudoers.d/10-wheel
          EOF

      - name: Apply davinci overlay
        run: |
          sudo cp ./repo/davinci/base/overlay/* -r ./mountpoint/
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          chmod +x /overlay-post-apply /usr/libexec/davinci/uki-regenerate
          /overlay-post-apply
          rm /overlay-post-apply
          EOF

      - name: Install systemd-boot + generate UKI
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          set -e
          # /boot lives on the rootfs (no separate ESP partition in v1).
          bootctl install --esp-path=/boot || bootctl install
          sed -i "s|HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)|HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block filesystems fsck)|g" /etc/mkinitcpio.conf || true
          mkinitcpio -P
          test -f /boot/EFI/Linux/arch-linux-davinci.efi
          ls -l /boot/EFI/Linux/ /boot/loader/entries/ || true
          EOF

      - name: Create user, clean cache
        run: |
          sudo arch-chroot ./mountpoint bash - <<'EOF'
          useradd -m -G wheel,audio,video,storage,optical -s /bin/bash user
          echo "user:123456" | chpasswd
          yes | pacman -Scc || true
          EOF

      - name: Unmount, shrink, assemble artifacts
        run: |
          sudo umount -R ./mountpoint
          rmdir ./mountpoint
          e2fsck -f rootfs-davinci-samsung.img -y
          resize2fs rootfs-davinci-samsung.img -M
          mkdir -p ./images
          mv ./rootfs-davinci-samsung.img ./images/
          # Bring in the verified prebuilt U-Boot (already fetched above).
          if [ ! -f ./images/boot-davinci-samsung.img ]; then
            cp ./repo/davinci/images/boot-davinci-samsung.img ./images/ 2>/dev/null || \
              (cd repo/davinci && ./scripts/fetch-uboot.sh ../../images)
          fi
          cp ./repo/davinci/flash-davinci-samsung.sh .
          cp ./repo/davinci/flash-davinci-samsung.bat .
          cp ./repo/davinci/README.md ./README-davinci.md
          cp ./repo/davinci/uboot.env .
          chmod +x flash-davinci-samsung.sh
          ls -l ./images/
          sha256sum ./images/* > ./images/SHA256SUMS
          cat ./images/SHA256SUMS

      - name: Upload davinci artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-davinci-samsung
          path: |
            images
            flash-davinci-samsung.sh
            flash-davinci-samsung.bat
            README-davinci.md
            uboot.env
          retention-days: 90
          compression-level: 5
